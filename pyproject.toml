[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "civiclens"
version = "0.1.0"
description = "Map community issues with geospatial reports and OpenCV photo checks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1.0",
    "numpy>=2.1,<3.0",
    "opencv-python-headless>=4.10,<5.0",
    "pymongo>=4.10,<5.0",
    "python-dotenv>=1.0,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<10.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.11,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "integration: requires an external service such as MongoDB",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
